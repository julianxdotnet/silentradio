name: Supabase provisioning tests

on:
  pull_request:
    paths:
      - 'supabase/provisioning/**'
      - '.github/workflows/supabase-provisioning.yml'
      - 'index.html'
      - 'scripts/build-site.mjs'
  push:
    branches: [main]
    paths:
      - 'supabase/provisioning/**'
      - '.github/workflows/supabase-provisioning.yml'
      - 'index.html'
      - 'scripts/build-site.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisioning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/provisioning
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fresh table access and current RPC flows
        run: npm test
      - name: Build allowlisted website assets
        working-directory: .
        run: node scripts/build-site.mjs

  postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact setup on isolated PostgreSQL 17
        run: bash supabase/provisioning/tests/postgres17.sh
