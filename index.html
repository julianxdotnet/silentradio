<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silent Radio</title>
  <meta name="description" content="A place for the songs that bring something back." />
  <style>
    :root{--bg:#fff;--ink:#201c19;--muted:#766e67;--line:#ded7cf;--soft:#f7f4ef;--yellow:#fff0a6;--blue:#dff5fb;--coral:#ff6f61;--green:#d9efcf;--shadow:0 18px 55px rgba(42,31,18,.10)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.page{padding:34px clamp(18px,4vw,62px) 64px}.shell{max-width:1120px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:54px}.wordmark{font-family:Georgia,"Times New Roman",serif;font-size:clamp(50px,7vw,92px);line-height:.88;letter-spacing:0}.tag{display:flex;gap:18px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:15px}.tag strong{color:var(--ink)}.nav{display:flex;gap:18px;color:var(--muted);font-size:14px;padding-top:12px}.nav button{border:0;background:transparent;color:inherit;padding:0}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}.eyebrow{color:var(--coral);font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:13px}.title{width:100%;border:0;background:transparent;outline:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,5vw,68px);line-height:1;color:var(--ink);padding:0}.subtitle{width:100%;max-width:700px;margin-top:16px;border:0;background:transparent;outline:0;resize:vertical;min-height:34px;color:var(--muted);font-size:18px;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;padding:12px 15px;font-weight:750}.btn.secondary{background:#fff;color:var(--ink)}.btn:disabled{opacity:.48;cursor:not-allowed}.create{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin:34px 0 14px;padding:13px;border:1px solid var(--line);border-left:10px solid var(--coral);border-radius:8px;background:#fff;box-shadow:var(--shadow);position:relative}.searchline{display:flex;align-items:center;gap:12px}.search-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);flex:0 0 auto}.searchline input{width:100%;border:0;outline:0;font-size:19px}.linkbtn{border:0;background:transparent;color:var(--muted);white-space:nowrap}.status{min-height:22px;color:var(--muted);font-size:14px;margin:0 0 26px}.results{display:none;position:absolute;top:calc(100% + 8px);left:14px;right:14px;z-index:10;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.results.active{display:block}.result{width:100%;display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;border:0;background:#fff;text-align:left;padding:10px 12px}.result:hover{background:#fff8d6}.thumb{width:50px;height:50px;border-radius:6px;background:var(--soft);object-fit:cover}.result small,.muted{color:var(--muted)}.entry{display:grid;grid-template-columns:64px minmax(180px,230px) minmax(0,1fr);gap:22px;margin:26px 0}.num{font-family:Georgia,"Times New Roman",serif;font-size:44px;color:var(--coral);line-height:1;padding-top:9px}.track,.feeling{border:1px solid var(--line);border-radius:8px}.track{padding:16px;background:var(--blue)}.label{color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}.cover{width:100%;aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,#9fe4f7,#ffe27a 42%,#ff6f61 72%,#2b225b);object-fit:cover;border:1px solid rgba(32,28,25,.15);margin-bottom:14px}.song-title{font-size:21px;font-weight:820;margin-bottom:4px}.song-meta{font-size:14px;color:var(--muted);line-height:1.35}.platforms{display:flex;gap:9px;margin-top:16px}.platform{width:38px;height:38px;border:1px solid rgba(32,28,25,.18);background:#fff;border-radius:50%;display:grid;place-items:center}.platform svg{width:20px;height:20px}.remove{border:0;background:transparent;color:var(--muted);padding:0;margin-top:13px;font-size:13px}.feeling{padding:clamp(22px,4vw,42px);background:var(--yellow);position:relative;overflow:hidden}.feeling:before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:var(--coral)}.prompt{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,3vw,42px);line-height:1.05;margin:0 0 18px}.note{width:100%;min-height:155px;border:0;border-radius:8px;outline:0;resize:vertical;padding:18px;background:rgba(255,255,255,.72);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,2.45vw,32px);line-height:1.24;box-shadow:inset 0 0 0 1px rgba(32,28,25,.1)}.note[readonly]{background:transparent;box-shadow:none;padding:0;resize:none}.empty{border:1px dashed var(--line);border-radius:8px;padding:38px;text-align:center;color:var(--muted);background:var(--soft)}.share{display:none;margin-top:18px;border:1px solid var(--line);border-radius:8px;background:var(--green);padding:16px}.share.active{display:block}.share-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.modal{border:0;border-radius:8px;padding:0;width:min(620px,calc(100vw - 32px));box-shadow:var(--shadow)}.modal::backdrop{background:rgba(32,28,25,.32)}.modal-inner{padding:24px}.modal h2{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:0 0 10px}.modal p{color:var(--muted);line-height:1.5}.modal textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}@media(max-width:860px){.top,.hero,.create{grid-template-columns:1fr;flex-direction:column;align-items:stretch}.entry{grid-template-columns:1fr}.num{padding:0}.actions{justify-content:flex-start}.results{left:12px;right:12px}.linkbtn{text-align:left}}
  </style>
</head>
<body>
<main class="page"><div class="shell">
  <header class="top"><div><div class="wordmark">Silent Radio</div><div class="tag"><strong>Don't listen, just feel.</strong><span>聴くんじゃなく、感じる。</span></div></div><nav class="nav"><button id="newBtn">Create</button><button id="demoBtn">Demo</button></nav></header>
  <section class="hero"><div><div class="eyebrow">A place for the songs that bring something back</div><input id="title" class="title" aria-label="Playlist title"><textarea id="subtitle" class="subtitle" aria-label="Playlist description"></textarea></div><div class="actions"><button id="saveBtn" class="btn">Save & publish</button><button id="copyPublic" class="btn secondary">Copy public link</button><button id="copyEdit" class="btn secondary">Copy edit link</button></div></section>
  <section id="share" class="share"><strong>Your Silent Radio is live.</strong><div class="muted" id="shareText"></div><div class="share-row"><button class="btn secondary" id="openPublic">Open public page</button><button class="btn secondary" id="openEdit">Open edit page</button></div></section>
  <section id="createBox" class="create"><div class="searchline"><div class="search-icon">⌕</div><input id="search" type="search" autocomplete="off" placeholder="Search for a song to add..."></div><button id="pasteBtn" class="linkbtn">or paste a playlist list</button><div id="results" class="results"></div></section>
  <div id="status" class="status"></div><section id="entries"></section>
</div></main>
<dialog id="pasteModal" class="modal"><form method="dialog" class="modal-inner"><h2>Paste a playlist</h2><p>Use one song per line, like “M83 - Midnight City”. We’ll add the tracks, then you write the feelings.</p><textarea id="pasteText" placeholder="M83 - Midnight City&#10;Frank Ocean - Pink + White"></textarea><div class="modal-actions"><button class="btn secondary" value="cancel">Cancel</button><button id="importBtn" class="btn" type="button">Import songs</button></div></form></dialog>
<script>
const SUPABASE_URL='https://pceoazjrgwrgxvrkvqbm.supabase.co';
const SUPABASE_KEY='sb_publishable_ffFzOfgtcjazMwSWO_BeIw_iogXn6iv';
const qs=new URLSearchParams(location.search);
let mode='edit', slug=qs.get('s'), editToken=qs.get('edit');
let state={title:'Untitled Silent Radio',subtitle:'A few songs, and the memories they unlock.',tracks:[]};
const demo={title:"Julian's Night Drive",subtitle:'17 tracks about city lights, soft regret, and getting home too late.',tracks:[{title:'Midnight City',artist:'M83',album:"Hurry Up, We're Dreaming",year:'2011',artwork_url:'',feeling:'It brings back walking through the city after the last train, when everything felt possible and slightly out of reach.'},{title:'Pink + White',artist:'Frank Ocean',album:'Blonde',year:'2016',artwork_url:'',feeling:'A song that makes time feel circular. Gentle, sunlit, and somehow already a memory.'}]};
const el={title:q('#title'),subtitle:q('#subtitle'),entries:q('#entries'),search:q('#search'),results:q('#results'),status:q('#status'),save:q('#saveBtn'),copyPublic:q('#copyPublic'),copyEdit:q('#copyEdit'),share:q('#share'),shareText:q('#shareText'),createBox:q('#createBox'),pasteModal:q('#pasteModal'),pasteText:q('#pasteText')};
function q(s){return document.querySelector(s)}
function flash(t){el.status.textContent=t;clearTimeout(window.ft);window.ft=setTimeout(()=>el.status.textContent='',3000)}
function api(path,opts={}){return fetch(`${SUPABASE_URL}${path}`,{...opts,headers:{apikey:SUPABASE_KEY,authorization:`Bearer ${SUPABASE_KEY}`,'content-type':'application/json',prefer:'return=representation',...(opts.headers||{})}})}
function enc(v){return encodeURIComponent(v||'')}
function publicUrl(){return `${location.origin}${location.pathname}?s=${slug}`}
function editUrl(){return `${location.origin}${location.pathname}?edit=${editToken}`}
function trackLinks(t){const query=enc(`${t.artist} ${t.title}`);return{apple:t.apple_url||`https://music.apple.com/search?term=${query}`,spotify:t.spotify_url||`https://open.spotify.com/search/${query}`,youtube:t.youtube_url||`https://www.youtube.com/results?search_query=${query}`}}
function icon(k){if(k==='apple')return '<svg viewBox="0 0 24 24" fill="none"><path d="M9 18.5A2.5 2.5 0 1 1 6.5 16 2.5 2.5 0 0 1 9 18.5Zm9-2A2.5 2.5 0 1 1 15.5 14 2.5 2.5 0 0 1 18 16.5Z" fill="#ff2d55"/><path d="M9 18.5V6.2l9-1.7v12" stroke="#ff2d55" stroke-width="2" stroke-linecap="round"/></svg>';if(k==='spotify')return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#1DB954"/><path d="M7.2 9.7c3.4-1 6.6-.8 9.6.7M8 12.4c2.7-.8 5.2-.6 7.5.5M8.8 15c1.9-.5 3.8-.4 5.5.4" stroke="#0b2515" stroke-width="1.7" stroke-linecap="round"/></svg>';return '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6.5" width="18" height="11" rx="3" fill="#ff0033"/><path d="m11 10 4 2-4 2v-4Z" fill="white"/></svg>'}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function normalizeTrack(t){return{title:t.title,artist:t.artist,album:t.album||'',year:t.year||'',artwork_url:t.artwork_url||'',apple_url:t.apple_url||'',spotify_url:t.spotify_url||'',youtube_url:t.youtube_url||'',feeling:t.feeling||''}}
function render(){el.title.value=state.title;el.subtitle.value=state.subtitle;el.title.readOnly=mode==='view';el.subtitle.readOnly=mode==='view';el.save.style.display=mode==='view'?'none':'';el.createBox.style.display=mode==='view'?'none':'grid';el.copyEdit.style.display=editToken?'':'none';el.copyPublic.style.display=slug?'':'none';el.entries.innerHTML=state.tracks.length?state.tracks.map((t,i)=>{const links=trackLinks(t);return `<article class="entry"><div class="num">${String(i+1).padStart(2,'0')}</div><section class="track"><div class="label">The Track</div>${t.artwork_url?`<img class="cover" src="${esc(t.artwork_url)}" alt="Album cover">`:`<div class="cover"></div>`}<div class="song-title">${esc(t.title)}</div><div class="song-meta">${esc(t.artist)}<br>${esc(t.album||'Single')} ${t.year?'· '+esc(t.year):''}</div><div class="platforms"><a class="platform" target="_blank" title="Apple Music" href="${links.apple}">${icon('apple')}</a><a class="platform" target="_blank" title="Spotify" href="${links.spotify}">${icon('spotify')}</a><a class="platform" target="_blank" title="YouTube" href="${links.youtube}">${icon('youtube')}</a></div>${mode==='edit'?`<button class="remove" data-remove="${i}">Remove</button>`:''}</section><section class="feeling"><div class="label">The Feeling</div><h2 class="prompt">What memory does this song unlock?</h2><textarea class="note" ${mode==='view'?'readonly':''} data-note="${i}" placeholder="Write the feeling here...">${esc(t.feeling)}</textarea></section></article>`}).join(''):'<div class="empty">Search for a song or paste a list to begin your Silent Radio.</div>';localStorage.setItem('silent-radio-draft',JSON.stringify(state))}
async function loadPublic(s){mode='view';flash('Loading Silent Radio...');const pres=await api(`/rest/v1/playlists?slug=eq.${enc(s)}&select=id,slug,title,subtitle&limit=1`);const playlists=await pres.json();if(!playlists.length)throw Error('Silent Radio not found');const p=playlists[0];const tres=await api(`/rest/v1/tracks?playlist_id=eq.${p.id}&select=title,artist,album,year,artwork_url,apple_url,spotify_url,youtube_url,feeling&order=position.asc`);state={title:p.title,subtitle:p.subtitle,tracks:await tres.json()};slug=p.slug;flash('')}
async function loadEdit(token){mode='edit';flash('Loading edit link...');const res=await api('/rest/v1/rpc/get_silent_radio_by_edit_token',{method:'POST',body:JSON.stringify({p_edit_token:token})});if(!res.ok)throw Error('Edit link not found');const data=await res.json();state={title:data.title,subtitle:data.subtitle,tracks:data.tracks||[]};slug=data.slug;editToken=data.edit_token;flash('')}
async function save(){state.title=el.title.value.trim()||'Untitled Silent Radio';state.subtitle=el.subtitle.value.trim();state.tracks=state.tracks.map(normalizeTrack);el.save.disabled=true;flash(editToken?'Saving changes...':'Publishing...');const endpoint=editToken?'update_silent_radio':'create_silent_radio';const body=editToken?{p_edit_token:editToken,p_title:state.title,p_subtitle:state.subtitle,p_tracks:state.tracks}:{p_title:state.title,p_subtitle:state.subtitle,p_tracks:state.tracks};try{const res=await api(`/rest/v1/rpc/${endpoint}`,{method:'POST',body:JSON.stringify(body)});if(!res.ok)throw Error(await res.text());const data=await res.json();const row=Array.isArray(data)?data[0]:data;slug=row.slug||slug;editToken=row.edit_token||editToken;history.replaceState(null,'',`?edit=${editToken}`);showShare();flash('Saved. Public link ready.')}catch(e){flash('Could not save. '+e.message)}finally{el.save.disabled=false;render()}}
function showShare(){if(!slug)return;el.share.classList.add('active');el.shareText.textContent=`Public: ${publicUrl()}  ·  Edit: ${editUrl()}`}
async function searchSongs(term){if(!term.trim()){el.results.classList.remove('active');return}const res=await fetch(`https://itunes.apple.com/search?term=${enc(term)}&entity=song&limit=8`);const data=await res.json();const rows=(data.results||[]).map(r=>({title:r.trackName,artist:r.artistName,album:r.collectionName,year:(r.releaseDate||'').slice(0,4),artwork_url:(r.artworkUrl100||'').replace('100x100bb','600x600bb'),apple_url:r.trackViewUrl||'',spotify_url:'',youtube_url:'',feeling:''}));el.results.innerHTML=rows.length?rows.map((r,i)=>`<button class="result" data-result="${i}"><img class="thumb" src="${esc(r.artwork_url)}" alt=""><span><strong>${esc(r.title)}</strong><br><small>${esc(r.artist)} · ${esc(r.album||'')}</small></span><small>Add</small></button>`).join(''):'<button class="result"><span>No results. Try artist and title.</span></button>';el.results._rows=rows;el.results.classList.add('active')}
function parseLine(line){const clean=line.trim().replace(/^\d+[.)]\s*/,'');if(!clean)return null;const parts=clean.split(/\s+[—-]\s+/);return{title:parts.length>1?parts.slice(1).join(' - ').trim():clean,artist:parts.length>1?parts[0].trim():'Unknown artist',album:'',year:'',artwork_url:'',apple_url:'',spotify_url:'',youtube_url:'',feeling:''}}
let st;el.search.addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>searchSongs(e.target.value),250)});el.search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchSongs(el.search.value)}});el.results.addEventListener('click',e=>{const b=e.target.closest('[data-result]');if(!b)return;state.tracks.push(el.results._rows[Number(b.dataset.result)]);el.search.value='';el.results.classList.remove('active');render();flash('Song added.')});el.entries.addEventListener('input',e=>{if(e.target.dataset.note!==undefined){state.tracks[Number(e.target.dataset.note)].feeling=e.target.value;localStorage.setItem('silent-radio-draft',JSON.stringify(state))}});el.entries.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){state.tracks.splice(Number(b.dataset.remove),1);render();flash('Removed track.')}});el.title.addEventListener('input',()=>{state.title=el.title.value;localStorage.setItem('silent-radio-draft',JSON.stringify(state))});el.subtitle.addEventListener('input',()=>{state.subtitle=el.subtitle.value;localStorage.setItem('silent-radio-draft',JSON.stringify(state))});q('#pasteBtn').onclick=()=>el.pasteModal.showModal();q('#importBtn').onclick=()=>{const rows=el.pasteText.value.split('\n').map(parseLine).filter(Boolean);state.tracks.push(...rows);el.pasteText.value='';el.pasteModal.close();render();flash(`Imported ${rows.length} song${rows.length===1?'':'s'}.`)};el.save.onclick=save;q('#newBtn').onclick=()=>{mode='edit';slug='';editToken='';state={title:'Untitled Silent Radio',subtitle:'A few songs, and the memories they unlock.',tracks:[]};history.replaceState(null,'',location.pathname);el.share.classList.remove('active');render();flash('New Silent Radio ready.')};q('#demoBtn').onclick=()=>{mode='edit';slug='';editToken='';state=JSON.parse(JSON.stringify(demo));history.replaceState(null,'',location.pathname);render();flash('Demo loaded.')};el.copyPublic.onclick=async()=>{if(!slug)return flash('Save first.');await navigator.clipboard.writeText(publicUrl());flash('Public link copied.')};el.copyEdit.onclick=async()=>{if(!editToken)return flash('Save first.');await navigator.clipboard.writeText(editUrl());flash('Edit link copied.')};q('#openPublic').onclick=()=>{if(slug) location.href=publicUrl()};q('#openEdit').onclick=()=>{if(editToken) location.href=editUrl()};
(async function init(){try{if(slug)await loadPublic(slug);else if(editToken)await loadEdit(editToken);else{const saved=localStorage.getItem('silent-radio-draft');state=saved?JSON.parse(saved):JSON.parse(JSON.stringify(demo));mode='edit'}render();showShare()}catch(e){flash(e.message);render()}})();
</script>
</body>
</html>
