<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silent Radio</title>
  <meta name="description" content="Silent Radio is a place for the songs that bring something back." />
  <style>
    :root {
      --paper: #ffffff; --ink: #241f1c; --muted: #756c63; --line: #decfb1;
      --coral: #ff6f61; --lemon: #ffe27a; --sky: #dff5fb; --green: #d8edc9;
      --white: #fffdf6; --shadow: 0 22px 70px rgba(72, 48, 27, .12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(90deg, rgba(36,31,28,.035) 1px, transparent 1px) 0 0/64px 64px, linear-gradient(rgba(36,31,28,.028) 1px, transparent 1px) 0 0/64px 64px, var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, textarea { font: inherit; } button { cursor: pointer; } a { color: inherit; text-decoration: none; }
    .page { min-height: 100vh; padding: 34px clamp(18px, 4vw, 64px) 56px; }
    .shell { max-width: 1180px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; gap: 28px; align-items: flex-start; margin-bottom: 52px; }
    .wordmark { font-family: Georgia, "Times New Roman", serif; font-size: clamp(48px, 6vw, 86px); line-height: .9; letter-spacing: 0; }
    .tagline { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 10px; color: var(--muted); font-size: 15px; }
    .tagline strong { color: var(--ink); }
    .nav { display: flex; gap: 18px; color: var(--muted); font-size: 14px; padding-top: 10px; }
    .nav button { border: 0; background: transparent; color: inherit; padding: 0; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; }
    .eyebrow { color: var(--coral); font-size: 13px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(39px, 5vw, 70px); line-height: 1; font-weight: 500; }
    .title-input { width: 100%; max-width: 820px; border: 0; background: transparent; color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-size: clamp(39px, 5vw, 70px); line-height: 1; outline: 0; padding: 0; }
    .intro-input { width: 100%; max-width: 680px; margin-top: 18px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1.55; outline: 0; resize: vertical; min-height: 32px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { border: 1px solid var(--ink); border-radius: 8px; background: var(--ink); color: var(--white); padding: 12px 16px; font-weight: 750; }
    .btn.secondary { background: var(--white); color: var(--ink); }
    .btn.ghost { background: transparent; color: var(--ink); }
    .create-strip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px; margin: 34px 0 38px; border: 1px solid var(--line); border-left: 10px solid var(--coral); border-radius: 8px; background: rgba(255,253,246,.78); box-shadow: var(--shadow); position: relative; }
    .search { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .search-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--lemon); display: grid; place-items: center; flex: 0 0 auto; }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 19px; }
    .paste-link { border: 0; background: transparent; color: var(--muted); white-space: nowrap; font-size: 14px; }
    .suggestions { position: absolute; left: 64px; right: 16px; top: calc(100% + 8px); z-index: 10; display: none; border: 1px solid var(--line); border-radius: 8px; background: var(--white); box-shadow: var(--shadow); overflow: hidden; }
    .suggestions.active { display: block; }
    .suggestion { width: 100%; border: 0; background: transparent; text-align: left; padding: 12px 14px; display: flex; justify-content: space-between; gap: 14px; }
    .suggestion:hover { background: #fff1ae; }
    .suggestion span { color: var(--muted); }
    .status { color: var(--muted); font-size: 14px; margin: -20px 0 24px 0; min-height: 20px; }
    .entry { display: grid; grid-template-columns: 74px minmax(190px, 250px) minmax(0, 1fr); gap: 24px; align-items: stretch; margin-bottom: 24px; }
    .number { font-family: Georgia, "Times New Roman", serif; font-size: 48px; color: var(--coral); line-height: 1; padding-top: 10px; }
    .track, .feeling { border: 1px solid var(--line); border-radius: 8px; }
    .track { padding: 18px; background: var(--sky); }
    .label { color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 16px; }
    .cover { aspect-ratio: 1; border-radius: 8px; margin-bottom: 16px; border: 1px solid rgba(36,31,28,.18); box-shadow: inset 0 0 0 10px rgba(255,255,255,.13); }
    .cover.c1 { background: radial-gradient(circle at 74% 18%, #ffe27a 0 10%, transparent 11%), radial-gradient(circle at 18% 74%, #ff6f61 0 14%, transparent 15%), linear-gradient(135deg, #1f8ec4, #c8f4e7 38%, #ffd179 39%, #f36c56 70%, #322b74); }
    .cover.c2 { background: radial-gradient(circle at 20% 20%, #fffdf6 0 12%, transparent 13%), linear-gradient(135deg, #f5a3bd, #ffe6a3 45%, #7fb8ff); }
    .cover.c3 { background: radial-gradient(circle at 70% 28%, #ffe27a 0 18%, transparent 19%), linear-gradient(135deg, #dc6eff, #ffb06d 44%, #93e3d0); }
    .cover.c4 { background: linear-gradient(135deg, #a2e2ff, #d8edc9 35%, #ff6f61 36%, #241f1c); }
    .song-title { font-size: 23px; font-weight: 800; margin-bottom: 4px; }
    .song-meta { color: var(--muted); line-height: 1.35; font-size: 14px; }
    .platforms { display: flex; gap: 10px; margin-top: 18px; }
    .platform { width: 40px; height: 40px; border: 1px solid rgba(36,31,28,.2); border-radius: 50%; display: grid; place-items: center; background: var(--white); }
    .platform svg { width: 20px; height: 20px; }
    .remove { margin-top: 14px; border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 13px; }
    .feeling { padding: clamp(24px, 4vw, 44px); background: #fff1ae; position: relative; overflow: hidden; }
    .feeling::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 9px; background: var(--coral); }
    .prompt { font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 3vw, 43px); line-height: 1.05; margin: 0 0 20px; }
    .note { border: 0; resize: vertical; min-height: 170px; width: 100%; outline: 0; border-radius: 8px; padding: 18px; background: rgba(255,253,246,.7); color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-size: clamp(22px, 2.5vw, 34px); line-height: 1.22; box-shadow: inset 0 0 0 1px rgba(36,31,28,.1); }
    .others { margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(36,31,28,.16); }
    .others-title { font-size: 13px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .comment-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .comment { border: 1px solid rgba(36,31,28,.14); border-radius: 8px; padding: 12px; background: rgba(255,253,246,.56); color: #4d453d; line-height: 1.4; font-size: 14px; margin: 0; }
    .comment span { display: block; margin-top: 6px; color: var(--muted); }
    .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 40px; background: rgba(255,253,246,.65); text-align: center; color: var(--muted); }
    .modal { border: 0; border-radius: 8px; padding: 0; width: min(620px, calc(100vw - 32px)); background: var(--white); color: var(--ink); box-shadow: var(--shadow); }
    .modal::backdrop { background: rgba(36,31,28,.34); }
    .modal-inner { padding: 24px; }
    .modal h2 { font-family: Georgia, "Times New Roman", serif; font-size: 34px; margin: 0 0 10px; }
    .modal p { color: var(--muted); line-height: 1.5; }
    .modal textarea { width: 100%; min-height: 210px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #ffffff; outline: 0; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    @media (max-width: 860px) {
      .topbar, .hero, .create-strip { grid-template-columns: 1fr; flex-direction: column; align-items: stretch; }
      .entry { grid-template-columns: 1fr; }
      .number { padding: 0; }
      .comment-list { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .suggestions { left: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="wordmark">Silent Radio</div>
          <div class="tagline"><strong>Don't listen, just feel.</strong><span>聴くんじゃなく、感じる。</span></div>
        </div>
        <nav class="nav" aria-label="Primary navigation"><button id="createNav">Create</button><button id="exploreNav">Explore</button><button id="signinNav">Sign in</button></nav>
      </header>

      <section class="hero" aria-labelledby="playlist-title">
        <div>
          <div class="eyebrow">A place for the songs that bring something back</div>
          <input id="titleInput" class="title-input" aria-label="Playlist title" />
          <textarea id="subtitleInput" class="intro-input" aria-label="Playlist description"></textarea>
        </div>
        <div class="actions"><button class="btn secondary" id="copyLink" type="button">Copy link</button><button class="btn" id="createYours" type="button">Create yours</button></div>
      </section>

      <section class="create-strip" aria-label="Add music">
        <div class="search"><div class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="m21 21-4.2-4.2m1.2-5.3a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg></div><input id="songSearch" type="search" autocomplete="off" placeholder="Search for a song to add..." /></div>
        <button class="paste-link" id="pastePlaylist" type="button">or paste a playlist link/list</button>
        <div id="suggestions" class="suggestions"></div>
      </section>
      <div id="status" class="status"></div>
      <section id="entries" aria-label="Playlist songs"></section>
    </div>
  </main>

  <dialog id="pasteModal" class="modal">
    <form method="dialog" class="modal-inner">
      <h2>Paste a playlist</h2>
      <p>Use one song per line. Try "M83 - Midnight City". Apple Music or Spotify links can live here later; this MVP parses plain track lists.</p>
      <textarea id="pasteText" placeholder="M83 - Midnight City&#10;Frank Ocean - Pink + White&#10;Cocteau Twins - Heaven or Las Vegas"></textarea>
      <div class="modal-actions"><button class="btn secondary" value="cancel" type="submit">Cancel</button><button class="btn" id="importList" value="default" type="button">Import songs</button></div>
    </form>
  </dialog>

  <script>
    const catalog = [
      { title: "Midnight City", artist: "M83", album: "Hurry Up, We're Dreaming", year: "2011", cover: "c1", feeling: "It brings back walking through the city after the last train, when everything felt possible and slightly out of reach.", others: [["That opening synth always feels like leaving somewhere.", "Mina"], ["I hear this and immediately remember moving apartments.", "Theo"]] },
      { title: "Pink + White", artist: "Frank Ocean", album: "Blonde", year: "2016", cover: "c2", feeling: "A song that makes time feel circular. Gentle, sunlit, and somehow already a memory.", others: [["It makes summer feel slower than it was.", "Rae"], ["The background vocals feel like forgiveness.", "Ken"]] },
      { title: "Heaven or Las Vegas", artist: "Cocteau Twins", album: "Heaven or Las Vegas", year: "1990", cover: "c3", feeling: "I don't understand every word, but I understand the color of it.", others: [["Pure gold light through curtains.", "Aya"], ["This sounds like a language I almost knew.", "Sam"]] },
      { title: "This Must Be the Place", artist: "Talking Heads", album: "Speaking in Tongues", year: "1983", cover: "c4", feeling: "A home song that doesn't need to be sentimental to be devastating.", others: [["It feels like choosing someone again.", "Nora"], ["The lamps are on in this song.", "Vic"]] },
      { title: "Teardrop", artist: "Massive Attack", album: "Mezzanine", year: "1998", cover: "c1", feeling: "A pulse in a quiet room. Something fragile refusing to disappear.", others: [["I hear rain on old windows.", "Mika"], ["It makes silence feel designed.", "Jo"]] },
      { title: "Sweet Disposition", artist: "The Temper Trap", album: "Conditions", year: "2008", cover: "c2", feeling: "All forward motion, like leaving before you know what you're leaving.", others: [["This is every train platform at once.", "Leo"], ["I remember being optimistic on purpose.", "Iman"]] }
    ];
    const defaultState = { title: "Julian's Night Drive", subtitle: "17 tracks about city lights, soft regret, and getting home too late.", tracks: catalog.slice(0, 3).map(cloneTrack) };
    let state = loadState();
    const els = {
      title: document.querySelector('#titleInput'), subtitle: document.querySelector('#subtitleInput'), entries: document.querySelector('#entries'), search: document.querySelector('#songSearch'), suggestions: document.querySelector('#suggestions'), status: document.querySelector('#status'), modal: document.querySelector('#pasteModal'), pasteText: document.querySelector('#pasteText')
    };
    function cloneTrack(t) { return JSON.parse(JSON.stringify(t)); }
    function query(t) { return encodeURIComponent(`${t.artist} ${t.title}`); }
    function platformUrl(t, platform) {
      const q = query(t);
      if (platform === 'apple') return `https://music.apple.com/search?term=${q}`;
      if (platform === 'spotify') return `https://open.spotify.com/search/${q}`;
      return `https://www.youtube.com/results?search_query=${q}`;
    }
    function loadState() {
      try {
        if (location.hash.startsWith('#sr=')) return JSON.parse(decodePayload(location.hash.slice(4)));
        const saved = localStorage.getItem('silent-radio-state');
        return saved ? JSON.parse(saved) : defaultState;
      } catch { return defaultState; }
    }
    function saveState() { localStorage.setItem('silent-radio-state', JSON.stringify(state)); }
    function encodePayload(value) { return btoa(unescape(encodeURIComponent(value))); }
    function decodePayload(value) { return decodeURIComponent(escape(atob(decodeURIComponent(value)))); }
    function encodeState() { return `${location.origin}${location.pathname}#sr=${encodeURIComponent(encodePayload(JSON.stringify(state)))}`; }
    function icon(kind) {
      if (kind === 'apple') return '<svg viewBox="0 0 24 24" fill="none"><path d="M9 18.5A2.5 2.5 0 1 1 6.5 16 2.5 2.5 0 0 1 9 18.5Zm9-2A2.5 2.5 0 1 1 15.5 14 2.5 2.5 0 0 1 18 16.5Z" fill="#ff2d55"/><path d="M9 18.5V6.2l9-1.7v12" stroke="#ff2d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (kind === 'spotify') return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#1DB954"/><path d="M7.2 9.7c3.4-1 6.6-.8 9.6.7M8 12.4c2.7-.8 5.2-.6 7.5.5M8.8 15c1.9-.5 3.8-.4 5.5.4" stroke="#0b2515" stroke-width="1.7" stroke-linecap="round"/></svg>';
      return '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6.5" width="18" height="11" rx="3" fill="#ff0033"/><path d="m11 10 4 2-4 2v-4Z" fill="white"/></svg>';
    }
    function render() {
      els.title.value = state.title;
      els.subtitle.value = state.subtitle;
      els.entries.innerHTML = state.tracks.length ? state.tracks.map((track, index) => `
        <article class="entry">
          <div class="number">${String(index + 1).padStart(2, '0')}</div>
          <section class="track"><div class="label">The Track</div><div class="cover ${track.cover || 'c1'}" role="img" aria-label="Album cover"></div><div class="song-title">${escapeHtml(track.title)}</div><div class="song-meta">${escapeHtml(track.artist)}<br />${escapeHtml(track.album || 'Single')} · ${escapeHtml(track.year || '')}</div><div class="platforms"><a class="platform" href="${platformUrl(track, 'apple')}" target="_blank" title="Apple Music" aria-label="Open in Apple Music">${icon('apple')}</a><a class="platform" href="${platformUrl(track, 'spotify')}" target="_blank" title="Spotify" aria-label="Open in Spotify">${icon('spotify')}</a><a class="platform" href="${platformUrl(track, 'youtube')}" target="_blank" title="YouTube" aria-label="Open on YouTube">${icon('youtube')}</a></div><button class="remove" data-remove="${index}" type="button">Remove</button></section>
          <section class="feeling"><div class="label">The Feeling</div><h2 class="prompt">What memory does this song unlock?</h2><textarea class="note" data-note="${index}">${escapeHtml(track.feeling || '')}</textarea><div class="others"><div class="others-title">Others remembered</div><div class="comment-list">${(track.others || []).slice(0,2).map(c => `<p class="comment">${escapeHtml(c[0])}<span>${escapeHtml(c[1])}</span></p>`).join('')}</div></div></section>
        </article>`).join('') : '<div class="empty">Search for a song or paste a list to begin your Silent Radio.</div>';
      saveState();
    }
    function escapeHtml(value) { return String(value).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
    function addTrack(track) { state.tracks.push(cloneTrack(track)); render(); flash(`Added ${track.title}.`); els.search.value = ''; hideSuggestions(); }
    function flash(text) { els.status.textContent = text; clearTimeout(window._flash); window._flash = setTimeout(() => els.status.textContent = '', 2400); }
    function hideSuggestions() { els.suggestions.classList.remove('active'); els.suggestions.innerHTML = ''; }
    function showSuggestions(term) {
      const clean = term.trim().toLowerCase();
      if (!clean) return hideSuggestions();
      const matches = catalog.filter(t => `${t.artist} ${t.title} ${t.album}`.toLowerCase().includes(clean)).slice(0, 5);
      const exactish = matches.length ? matches : [{ title: term.trim(), artist: 'Unknown artist', album: 'Search result', year: '', cover: 'c4', feeling: '', others: [] }];
      els.suggestions.innerHTML = exactish.map((t, i) => `<button class="suggestion" data-suggest="${i}" type="button"><strong>${escapeHtml(t.title)}</strong><span>${escapeHtml(t.artist)} ${t.year ? '· ' + escapeHtml(t.year) : ''}</span></button>`).join('');
      els.suggestions._matches = exactish;
      els.suggestions.classList.add('active');
    }
    function parseLine(line) {
      const cleaned = line.trim().replace(/^\d+[.)]\s*/, '');
      if (!cleaned) return null;
      const parts = cleaned.split(/\s+[—-]\s+/);
      const artist = parts.length > 1 ? parts[0].trim() : 'Unknown artist';
      const title = parts.length > 1 ? parts.slice(1).join(' - ').trim() : cleaned;
      const found = catalog.find(t => `${t.artist} ${t.title}`.toLowerCase().includes(`${artist} ${title}`.toLowerCase()) || `${t.title} ${t.artist}`.toLowerCase().includes(`${title} ${artist}`.toLowerCase()));
      return found ? cloneTrack(found) : { title, artist, album: 'Imported track', year: '', cover: `c${1 + Math.floor(Math.random() * 4)}`, feeling: '', others: [] };
    }
    els.search.addEventListener('input', e => showSuggestions(e.target.value));
    els.search.addEventListener('keydown', e => { if (e.key === 'Enter' && els.search.value.trim()) { e.preventDefault(); const first = els.suggestions._matches?.[0] || parseLine(els.search.value); if (first) addTrack(first); } });
    els.suggestions.addEventListener('click', e => { const btn = e.target.closest('[data-suggest]'); if (btn) addTrack(els.suggestions._matches[Number(btn.dataset.suggest)]); });
    document.addEventListener('click', e => { if (!e.target.closest('.create-strip')) hideSuggestions(); });
    els.entries.addEventListener('input', e => { const index = e.target.dataset.note; if (index !== undefined) { state.tracks[Number(index)].feeling = e.target.value; saveState(); } });
    els.entries.addEventListener('click', e => { const btn = e.target.closest('[data-remove]'); if (btn) { state.tracks.splice(Number(btn.dataset.remove), 1); render(); flash('Removed track.'); } });
    els.title.addEventListener('input', e => { state.title = e.target.value; saveState(); });
    els.subtitle.addEventListener('input', e => { state.subtitle = e.target.value; saveState(); });
    document.querySelector('#pastePlaylist').addEventListener('click', () => els.modal.showModal());
    document.querySelector('#importList').addEventListener('click', () => { const tracks = els.pasteText.value.split('\n').map(parseLine).filter(Boolean); state.tracks.push(...tracks); els.modal.close(); els.pasteText.value = ''; render(); flash(`Imported ${tracks.length} song${tracks.length === 1 ? '' : 's'}.`); });
    document.querySelector('#copyLink').addEventListener('click', async () => { const link = encodeState(); try { await navigator.clipboard.writeText(link); flash('Share link copied.'); } catch { prompt('Copy your Silent Radio link:', link); } });
    document.querySelector('#createYours').addEventListener('click', () => { state = { title: 'Untitled Silent Radio', subtitle: 'A few songs, and the memories they unlock.', tracks: [] }; location.hash = ''; render(); flash('Blank Silent Radio ready.'); });
    document.querySelector('#createNav').addEventListener('click', () => document.querySelector('#songSearch').focus());
    document.querySelector('#exploreNav').addEventListener('click', () => flash('Explore would show public Silent Radios in the next build.'));
    document.querySelector('#signinNav').addEventListener('click', () => flash('No login needed for this MVP. Save happens in this browser.'));
    render();
  </script>
</body>
</html>
