<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silent Radio</title>
<style>
:root{--ink:#201c19;--muted:#756e68;--line:#ddd7d0;--yellow:#fff0a6;--blue:#dff5fb;--coral:#ff6f61;--green:#d9efcf}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.page{padding:34px clamp(18px,4vw,62px) 64px}.shell{max-width:1120px;margin:auto}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:54px}.wordmark{font-family:Georgia,serif;font-size:clamp(54px,7vw,94px);line-height:.88}.tag{display:flex;gap:18px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:15px}.tag strong{color:var(--ink)}.nav{display:flex;gap:18px;color:var(--muted);font-size:14px;padding-top:12px}.nav button{border:0;background:transparent;color:inherit;padding:0}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}.eyebrow{color:var(--coral);font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:13px}.title{width:100%;border:0;background:transparent;outline:0;font-family:Georgia,serif;font-size:clamp(38px,5vw,68px);line-height:1;color:var(--ink);padding:0}.subtitle{width:100%;max-width:700px;margin-top:16px;border:0;background:transparent;outline:0;resize:vertical;min-height:34px;color:var(--muted);font-size:18px;line-height:1.5}.creator{display:block;width:min(360px,100%);margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;color:var(--ink);outline:0}.byline{margin-top:12px;color:var(--muted);font-size:15px}.byline strong{color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;padding:12px 15px;font-weight:750}.btn.secondary{background:#fff;color:var(--ink)}.create{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin:34px 0 14px;padding:13px;border:1px solid var(--line);border-left:10px solid var(--coral);border-radius:8px;background:#fff;box-shadow:0 18px 55px rgba(42,31,18,.1);position:relative}.searchline{display:flex;align-items:center;gap:12px}.search-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);flex:0 0 auto}.searchline input{width:100%;border:0;outline:0;font-size:19px}.linkbtn{border:0;background:transparent;color:var(--muted);white-space:nowrap}.status{min-height:22px;color:var(--muted);font-size:14px;margin:0 0 26px}.results{display:none;position:absolute;top:calc(100% + 8px);left:14px;right:14px;z-index:10;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 55px rgba(42,31,18,.1);overflow:hidden}.results.active{display:block}.result{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:0;background:#fff;text-align:left;padding:13px}.result:hover{background:#fff8d6}.result.manual{border-top:1px solid var(--line)}.muted,.result small{color:var(--muted)}.entry{display:grid;grid-template-columns:64px minmax(180px,230px) minmax(0,1fr);gap:22px;margin:26px 0}.num{font-family:Georgia,serif;font-size:44px;color:var(--coral);line-height:1;padding-top:9px}.track,.feeling{border:1px solid var(--line);border-radius:8px}.track{padding:16px;background:var(--blue)}.label{color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}.turntable{width:100%;aspect-ratio:1;border-radius:8px;background:#fff;border:1px solid rgba(32,28,25,.15);margin-bottom:14px;display:block;box-shadow:inset 0 -18px 0 rgba(32,28,25,.06)}.song-title{font-size:21px;font-weight:820;margin-bottom:4px}.song-meta{font-size:14px;color:var(--muted);line-height:1.35}.platforms{display:flex;gap:9px;margin-top:16px}.platform{width:38px;height:38px;border:1px solid rgba(32,28,25,.18);background:#fff;border-radius:50%;display:grid;place-items:center;color:inherit;text-decoration:none}.platform svg{width:24px;height:24px;display:block}.remove{border:0;background:transparent;color:var(--muted);padding:0;margin-top:13px;font-size:13px}.feeling{padding:clamp(22px,4vw,42px);background:var(--yellow);position:relative;overflow:hidden}.feeling:before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:var(--coral)}.prompt{font-family:Georgia,serif;font-size:clamp(28px,3vw,42px);line-height:1.05;margin:0 0 18px}.note{width:100%;min-height:155px;border:0;border-radius:8px;outline:0;resize:vertical;padding:18px;background:rgba(255,255,255,.72);color:var(--ink);font-family:Georgia,serif;font-size:clamp(22px,2.45vw,32px);line-height:1.24;box-shadow:inset 0 0 0 1px rgba(32,28,25,.1)}.note[readonly]{background:transparent;box-shadow:none;padding:0;resize:none}.empty{border:1px dashed var(--line);border-radius:8px;padding:38px;text-align:center;color:var(--muted);background:#f7f7f7}.share{display:none;margin-top:18px;border:1px solid var(--line);border-radius:8px;background:var(--green);padding:16px}.share.active{display:block}.share-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.modal{border:0;border-radius:8px;padding:0;width:min(620px,calc(100vw - 32px));box-shadow:0 18px 55px rgba(42,31,18,.1)}.modal::backdrop{background:rgba(32,28,25,.32)}.modal-inner{padding:24px}.modal h2{font-family:Georgia,serif;font-size:34px;margin:0 0 10px}.modal p{color:var(--muted);line-height:1.5}.modal textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}@media(max-width:860px){.top,.hero,.create{grid-template-columns:1fr;flex-direction:column;align-items:stretch}.entry{grid-template-columns:1fr}.num{padding:0}.linkbtn{text-align:left}}
</style>
</head>
<body>
<main class="page"><div class="shell"><header class="top"><div><div class="wordmark">Silent Radio</div><div class="tag"><strong>Don't listen, just feel.</strong><span>聴くんじゃなく、感じる。</span></div></div><nav class="nav"><button id="newBtn">Create</button><button id="demoBtn">Demo</button></nav></header><section class="hero"><div><div class="eyebrow">Selections of songs, and why they matter</div><input id="title" class="title" aria-label="Selection title"><textarea id="subtitle" class="subtitle" aria-label="Selection description"></textarea><input id="creator" class="creator" aria-label="Creator name" placeholder="Selected by: you, Chappie, Claude, Grok..."><div id="byline" class="byline"></div></div><div class="actions"><button id="saveBtn" class="btn">Save & publish selection</button><button id="copyPublic" class="btn secondary">Copy public link</button><button id="copyEdit" class="btn secondary">Copy edit link</button></div></section><section id="share" class="share"><strong>Your selection is live.</strong><div class="muted" id="shareText"></div><div class="share-row"><button class="btn secondary" id="openPublic">Open public page</button><button class="btn secondary" id="openEdit">Open edit page</button></div></section><section id="createBox" class="create"><div class="searchline"><div class="search-icon">⌕</div><input id="search" type="search" autocomplete="off" placeholder="Search for a song to add..."></div><button id="pasteBtn" class="linkbtn">or paste a playlist list</button><div id="results" class="results"></div></section><div id="status" class="status"></div><section id="entries"></section></div></main><dialog id="pasteModal" class="modal"><form method="dialog" class="modal-inner"><h2>Paste a playlist</h2><p>Use one song per line. Best format: The Beatles - Bad Boy. We'll add the tracks, then you write the feelings.</p><textarea id="pasteText" placeholder="M83 - Midnight City&#10;Frank Ocean - Pink + White"></textarea><div class="modal-actions"><button class="btn secondary" value="cancel">Cancel</button><button id="importBtn" class="btn" type="button">Import songs</button></div></form></dialog>
<script>
const SUPABASE_URL='https://pceoazjrgwrgxvrkvqbm.supabase.co';const SUPABASE_KEY='sb_publishable_ffFzOfgtcjazMwSWO_BeIw_iogXn6iv';const qs=new URLSearchParams(location.search);let mode='edit',slug=qs.get('s'),editToken=qs.get('edit');let state={title:'Untitled Silent Radio',subtitle:'One song or a group of tracks, and the feelings they unlock.',creator_name:'Anonymous listener',tracks:[]};const demo={title:"Julian's Night Drive",subtitle:'A selection about city lights, soft regret, and getting home too late.',creator_name:'Julian',tracks:[{title:'Midnight City',artist:'M83',album:'Hurry Up, We Are Dreaming',year:'2011',feeling:'It brings back walking through the city after the last train, when everything felt possible and slightly out of reach.'},{title:'Pink + White',artist:'Frank Ocean',album:'Blonde',year:'2016',feeling:'A song that makes time feel circular. Gentle, sunlit, and somehow already a memory.'}]};const q=s=>document.querySelector(s);const el={title:q('#title'),subtitle:q('#subtitle'),creator:q('#creator'),byline:q('#byline'),entries:q('#entries'),search:q('#search'),results:q('#results'),status:q('#status'),save:q('#saveBtn'),copyPublic:q('#copyPublic'),copyEdit:q('#copyEdit'),share:q('#share'),shareText:q('#shareText'),createBox:q('#createBox'),pasteModal:q('#pasteModal'),pasteText:q('#pasteText')};function flash(t){el.status.textContent=t;clearTimeout(window.ft);window.ft=setTimeout(()=>el.status.textContent='',3000)}function api(path,opts={}){return fetch(`${SUPABASE_URL}${path}`,{...opts,headers:{apikey:SUPABASE_KEY,authorization:`Bearer ${SUPABASE_KEY}`,'content-type':'application/json',prefer:'return=representation',...(opts.headers||{})}})}function enc(v){return encodeURIComponent(v||'')}function publicUrl(){return `${location.origin}${location.pathname}?s=${slug}`}function editUrl(){return `${location.origin}${location.pathname}?edit=${editToken}`}function cleanArtist(t){const a=String(t.artist||'').trim();return /^unknown\s*artist$/i.test(a)||/^unknown\+artist$/i.test(a)?'':a}function displayArtist(t){return cleanArtist(t)||'Artist not set'}function text(t){return [cleanArtist(t),t.title].filter(Boolean).join(' ').trim()}function links(t){const x=text(t),sq=enc(x);return{youtube:t.youtube_url||`https://www.youtube.com/results?search_query=${sq}`,spotify:t.spotify_url||`https://open.spotify.com/search/${sq}`,apple:t.apple_url||`https://music.apple.com/us/search?term=${sq}`}}function platformIcon(name){const icons={youtube:`<svg viewBox="0 0 24 24" role="img" aria-label="YouTube"><rect x="2" y="5.5" width="20" height="13" rx="4" fill="#ff0000"/><path d="M10 9.1v5.8l5-2.9-5-2.9z" fill="#fff"/></svg>`,spotify:`<svg viewBox="0 0 24 24" role="img" aria-label="Spotify"><circle cx="12" cy="12" r="11" fill="#1db954"/><path d="M7.1 9.2c3.5-1 7.3-.6 10.4 1" fill="none" stroke="#191414" stroke-width="1.9" stroke-linecap="round"/><path d="M7.6 12c2.8-.8 5.9-.5 8.5.8" fill="none" stroke="#191414" stroke-width="1.6" stroke-linecap="round"/><path d="M8.2 14.7c2-.5 4.2-.3 6.2.7" fill="none" stroke="#191414" stroke-width="1.4" stroke-linecap="round"/></svg>`,apple:`<svg viewBox="0 0 24 24" role="img" aria-label="Apple Music"><defs><linearGradient id="amg" x1="3" y1="21" x2="21" y2="3"><stop stop-color="#fa233b"/><stop offset=".55" stop-color="#fb5c74"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="url(#amg)"/><path d="M15.8 7.2v9.1c0 1.4-1.1 2.4-2.6 2.4-1.2 0-2.1-.7-2.1-1.7 0-1.1 1-1.8 2.3-1.8.4 0 .8.1 1.1.2V9.7l-5.2 1.1v6c0 1.4-1.1 2.4-2.6 2.4-1.2 0-2.1-.7-2.1-1.7 0-1.1 1-1.8 2.3-1.8.4 0 .8.1 1.1.2V8.9l7.8-1.7z" fill="#fff"/></svg>`};return icons[name]}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function normalize(t){return{title:t.title,artist:t.artist,album:t.album||'',year:t.year||'',artwork_url:t.artwork_url||'',apple_url:t.apple_url||'',spotify_url:t.spotify_url||'',youtube_url:t.youtube_url||'',feeling:t.feeling||''}}function turntable(){return `<svg class="turntable" viewBox="0 0 220 220" role="img" aria-label="Vinyl record on a turntable"><rect x="18" y="18" width="184" height="184" rx="14" fill="#fff"/><rect x="38" y="176" width="110" height="10" rx="5" fill="rgba(32,28,25,.12)"/><circle cx="92" cy="101" r="62" fill="#201c19"/><circle cx="92" cy="101" r="48" fill="none" stroke="#4a413b" stroke-width="4"/><circle cx="92" cy="101" r="32" fill="none" stroke="#39312c" stroke-width="2"/><circle cx="92" cy="101" r="15" fill="#ff6f61"/><circle cx="92" cy="101" r="5" fill="#fff"/><circle cx="168" cy="52" r="24" fill="#201c19"/><circle cx="168" cy="52" r="17" fill="#8f8a84"/><path d="M164 66 C151 84 137 101 113 121" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" opacity=".92"/><path d="M164 66 C151 84 137 101 113 121" fill="none" stroke="#201c19" stroke-width="16" stroke-linecap="round"/><path d="M164 66 C151 84 137 101 113 121" fill="none" stroke="#8f8a84" stroke-width="11" stroke-linecap="round"/><g transform="rotate(-50 108 128)"><rect x="97" y="121" width="22" height="18" rx="3" fill="#8f8a84" stroke="#201c19" stroke-width="4"/><path d="M108 139 L108 150" stroke="#201c19" stroke-width="5" stroke-linecap="round"/><path d="M108 139 L108 147" stroke="#8f8a84" stroke-width="2" stroke-linecap="round"/></g><circle cx="106" cy="132" r="4" fill="#201c19"/><path d="M168 46 C165 41 157 43 157 50 C157 58 168 64 168 64 C168 64 179 58 179 50 C179 43 171 41 168 46Z" fill="#ff6f61" stroke="#201c19" stroke-width="3" stroke-linejoin="round"/><rect x="45" y="187" width="130" height="7" rx="4" fill="rgba(32,28,25,.08)"/></svg>`}function render(){el.title.value=state.title;el.subtitle.value=state.subtitle;el.creator.value=state.creator_name||'';el.byline.innerHTML=mode==='view'?`Tracks selected by <strong>${esc(state.creator_name||'Anonymous listener')}</strong>`:'';el.creator.style.display=mode==='view'?'none':'block';el.title.readOnly=mode==='view';el.subtitle.readOnly=mode==='view';el.creator.readOnly=mode==='view';el.save.style.display=mode==='view'?'none':'';el.createBox.style.display=mode==='view'?'none':'grid';el.copyEdit.style.display=editToken?'':'none';el.copyPublic.style.display=slug?'':'none';el.entries.innerHTML=state.tracks.length?state.tracks.map((t,i)=>{const l=links(t);return `<article class="entry"><div class="num">${String(i+1).padStart(2,'0')}</div><section class="track"><div class="label">The Track</div>${turntable()}<div class="song-title">${esc(t.title)}</div><div class="song-meta">${esc(displayArtist(t))}<br>${esc(t.album||'Single')} ${t.year?'· '+esc(t.year):''}</div><div class="platforms"><a class="platform" target="_blank" title="YouTube" href="${l.youtube}">${platformIcon('youtube')}</a><a class="platform" target="_blank" title="Spotify" href="${l.spotify}">${platformIcon('spotify')}</a><a class="platform" target="_blank" title="Apple Music" href="${l.apple}">${platformIcon('apple')}</a></div>${mode==='edit'?`<button class="remove" data-remove="${i}">Remove</button>`:''}</section><section class="feeling"><div class="label">The Feeling</div><h2 class="prompt">What memory does this song unlock?</h2><textarea class="note" ${mode==='view'?'readonly':''} data-note="${i}" placeholder="Write the feeling here...">${esc(t.feeling)}</textarea></section></article>`}).join(''):'<div class="empty">Search for one song or add a group of tracks to begin your selection.</div>';localStorage.setItem('silent-radio-draft',JSON.stringify(state))}async function loadPublic(s){mode='view';flash('Loading Silent Radio...');const pres=await api(`/rest/v1/playlists?slug=eq.${enc(s)}&select=id,slug,title,subtitle,creator_name&limit=1`);const playlists=await pres.json();if(!playlists.length)throw Error('Silent Radio not found');const p=playlists[0];const tres=await api(`/rest/v1/tracks?playlist_id=eq.${p.id}&select=title,artist,album,year,artwork_url,apple_url,spotify_url,youtube_url,feeling&order=position.asc`);state={title:p.title,subtitle:p.subtitle,creator_name:p.creator_name||'Anonymous listener',tracks:await tres.json()};slug=p.slug;flash('')}async function loadEdit(token){mode='edit';flash('Loading edit link...');const res=await api('/rest/v1/rpc/get_silent_radio_by_edit_token',{method:'POST',body:JSON.stringify({p_edit_token:token})});if(!res.ok)throw Error('Edit link not found');const data=await res.json();state={title:data.title,subtitle:data.subtitle,creator_name:data.creator_name||'Anonymous listener',tracks:data.tracks||[]};slug=data.slug;editToken=data.edit_token;flash('')}async function save(){state.title=el.title.value.trim()||'Untitled Silent Radio';state.subtitle=el.subtitle.value.trim();state.creator_name=el.creator.value.trim()||'Anonymous listener';state.tracks=state.tracks.map(normalize);el.save.disabled=true;flash(editToken?'Saving changes...':'Publishing...');const endpoint=editToken?'update_silent_radio':'create_silent_radio';const body=editToken?{p_edit_token:editToken,p_title:state.title,p_subtitle:state.subtitle,p_creator_name:state.creator_name,p_tracks:state.tracks}:{p_title:state.title,p_subtitle:state.subtitle,p_creator_name:state.creator_name,p_tracks:state.tracks};try{const res=await api(`/rest/v1/rpc/${endpoint}`,{method:'POST',body:JSON.stringify(body)});if(!res.ok)throw Error(await res.text());const data=await res.json();const row=Array.isArray(data)?data[0]:data;slug=row.slug||slug;editToken=row.edit_token||editToken;history.replaceState(null,'',`?edit=${editToken}`);showShare();flash('Saved. Public link ready.')}catch(e){flash('Could not save. '+e.message)}finally{el.save.disabled=false;render()}}function showShare(){if(!slug)return;el.share.classList.add('active');el.shareText.textContent=`Public: ${publicUrl()} · Edit: ${editUrl()}`}function parseLine(line){const clean=line.trim().replace(/^\d+[.)]\s*/,'');if(!clean)return null;const parts=clean.split(/\s+[—-]\s+/);return{raw:clean,title:parts.length>1?parts.slice(1).join(' - ').trim():clean,artist:parts.length>1?parts[0].trim():'Unknown artist',album:'',year:'',feeling:''}}function fromItunes(r){return{title:r.trackName||'',artist:r.artistName||'',album:r.collectionName||'',year:r.releaseDate?String(new Date(r.releaseDate).getFullYear()):'',artwork_url:r.artworkUrl100||'',apple_url:r.trackViewUrl||'',spotify_url:'',youtube_url:'',feeling:''}}function resultButton(t,i,isManual=false){return `<button class="result ${isManual?'manual':''}" data-result="${i}"><span><strong>${esc(t.title)}</strong><br><small>${esc(displayArtist(t))}${t.album?' · '+esc(t.album):''}${t.year?' · '+esc(t.year):''}</small></span><small>${isManual?'Add typed':'Add'}</small></button>`}async function searchSongs(term){const raw=term.trim();if(!raw){el.results.classList.remove('active');return}const manual=parseLine(raw)||{title:raw,artist:''};el.results.innerHTML='<button class="result"><span><strong>Searching...</strong><br><small>Looking for real track matches</small></span></button>';el.results.classList.add('active');let rows=[];try{const res=await fetch(`https://itunes.apple.com/search?entity=song&limit=5&term=${enc(raw)}`);const data=await res.json();rows=(data.results||[]).map(fromItunes).filter(t=>t.title&&t.artist)}catch(e){rows=[]}const all=[...rows,manual];el.results._rows=all;el.results.innerHTML=(rows.length?rows.map((t,i)=>resultButton(t,i)).join(''):'<button class="result"><span><strong>No exact suggestions found</strong><br><small>You can still add what you typed.</small></span></button>')+resultButton(manual,rows.length,true)}let st;el.search.addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>searchSongs(e.target.value),250)});el.results.addEventListener('click',e=>{const b=e.target.closest('[data-result]');if(!b)return;state.tracks.unshift(el.results._rows[Number(b.dataset.result)]);el.search.value='';el.results.classList.remove('active');render();flash('Song added to top of selection.')});el.entries.addEventListener('input',e=>{if(e.target.dataset.note!==undefined){state.tracks[Number(e.target.dataset.note)].feeling=e.target.value;localStorage.setItem('silent-radio-draft',JSON.stringify(state))}});el.entries.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){state.tracks.splice(Number(b.dataset.remove),1);render();flash('Removed track.')}});el.title.addEventListener('input',()=>{state.title=el.title.value;localStorage.setItem('silent-radio-draft',JSON.stringify(state))});el.subtitle.addEventListener('input',()=>{state.subtitle=el.subtitle.value;localStorage.setItem('silent-radio-draft',JSON.stringify(state))});el.creator.addEventListener('input',()=>{state.creator_name=el.creator.value;localStorage.setItem('silent-radio-draft',JSON.stringify(state))});q('#pasteBtn').onclick=()=>el.pasteModal.showModal();q('#importBtn').onclick=()=>{const rows=el.pasteText.value.split('\n').map(parseLine).filter(Boolean);if(!rows.length)return;state.tracks.unshift(...rows);el.pasteText.value='';el.pasteModal.close();render();flash(`Imported ${rows.length} song${rows.length===1?'':'s'}.`)};el.save.onclick=save;q('#newBtn').onclick=()=>{mode='edit';slug='';editToken='';state={title:'Untitled Silent Radio',subtitle:'One song or a group of tracks, and the feelings they unlock.',creator_name:'Anonymous listener',tracks:[]};history.replaceState(null,'',location.pathname);el.share.classList.remove('active');render();flash('New Silent Radio ready.')};q('#demoBtn').onclick=()=>{mode='edit';slug='';editToken='';state=JSON.parse(JSON.stringify(demo));history.replaceState(null,'',location.pathname);render();flash('Demo loaded.')};el.copyPublic.onclick=async()=>{if(!slug)return flash('Save first.');await navigator.clipboard.writeText(publicUrl());flash('Public link copied.')};el.copyEdit.onclick=async()=>{if(!editToken)return flash('Save first.');await navigator.clipboard.writeText(editUrl());flash('Edit link copied.')};q('#openPublic').onclick=()=>{if(slug)location.href=publicUrl()};q('#openEdit').onclick=()=>{if(editToken)location.href=editUrl()};(async function init(){try{if(slug)await loadPublic(slug);else if(editToken)await loadEdit(editToken);else{const saved=localStorage.getItem('silent-radio-draft');state=saved?JSON.parse(saved):JSON.parse(JSON.stringify(demo));mode='edit'}render();showShare()}catch(e){flash(e.message);render()}})();
</script>
